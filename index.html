let h="";
if(tab=="oggi"){const days=Math.ceil((sb.next.t-t)/864e5),np=nextPhases(t),top=aspects(K,K,4,true).slice(0,3),tr=N?aspects(K,N.l,3).slice(0,4):[];
h=`<h1 class="fade">${P.name?`Ciao, ${P.name}`:"ANIMA"}</h1><p class="q mu">Non devi controllare il ritmo della vita. Devi imparare ad ascoltarlo.</p>
<div class="card"><h2>${sn}</h2><p class="mu">Dal ${dm(sb.cur.t,{day:"numeric",month:"long"})} · ${days} giorni a ${sb.next.n} (${dm(sb.next.t,{day:"numeric",month:"long"})})</p><p>Tema: ${SB[sn].t}.</p><button class="g" onclick="openSb('${sn}')">Apri la scheda</button></div>
<div class="card row">${moonSvg(K._e)}<div><h3>${PH[pi]}</h3><p class="mu" style="margin:0">${Math.round(K._ill*100)}% illuminata · età ${K._age.toFixed(1)} giorni<br>Luna in ${Z[ms]} · ${Math.round(K._dist).toLocaleString("it-IT")} km</p></div></div>
<div class="card"><h3>Lettura integrata</h3><p>Siamo in ${sn} (${SB[sn].t.split(",")[0]}), con ${PH[pi].toLowerCase()} in ${Z[ms]} (${el}: ${EL[el]}). Fase lunare: ${LP[pi].k}. ${top[0]?`Aspetto del giorno: ${top[0].a} in ${top[0].n} con ${top[0].b} (${top[0].m}), tema simbolico di ${KW[top[0].a]} e ${KW[top[0].b]}.`:""}</p><p>Pratica: <b>${SB[sn].p.t}</b>. Atteggiamento lunare: ${LP[pi].p}</p>${tr.length?`<p class="mu">Per il tuo tema: ${tr.map(x=>`${x.a} ${x.n} ${x.b} natale`).join("; ")}.</p>`:`<p class="mu">Inserisci i dati di nascita in “Io” per le letture personali.</p>`}<div class="src">Letture simboliche, non previsioni. Dati: calcolo locale con elementi orbitali a bassa precisione.</div></div>
<h2>La pratica di oggi</h2>${pracCard(sn,true)}
<div class="card"><h3>Prossime fasi</h3><table>${np.map(x=>`<tr><td>${x.n}</td><td>${x.t?dt(x.t):"—"}</td></tr>`).join("")}</table></div>${stamp()}`}
if(tab=="ruota"){if(sel){const S=SB[sel];h=`<button class="g" onclick="go('ruota')">← Ruota</button><h1 style="margin-top:12px">${sel}</h1><p>${sb.list.find(x=>x.n==sel&&x.t>t-3e10).t?dm(sb.list.find(x=>x.n==sel&&x.t>t-18e9).t):""}</p><div class="card"><p>Tema: ${S.t}.</p><div class="sym"><b>Colori:</b> ${S.c}<br><b>Simboli:</b> ${S.s}</div><p>${S.h}</p><p class="mu">Distinzione: le fonti storiche sono quelle indicate sopra; ogni altra pratica è interpretazione spirituale moderna, personale e facoltativa.</p></div>${pracCard(sel,false)}`}
else h=`<h1>La Ruota dell’Anno</h1>${wheel(sn)}<p class="mu">Tocca un Sabbat. Solstizi ed equinozi sono calcolati dal Sole; le feste a metà strada hanno date tradizionali fisse (1 nov., 2 feb., 30 apr., 1 ago.).</p><div class="card"><table>${sb.list.filter(x=>x.t>t-18e9&&x.t<t+3.2e10).map(x=>`<tr><td>${x.n}</td><td>${dt(x.t).split(",")[0]}</td></tr>`).join("")}</table></div>`}
if(tab=="luna"){h=`<h1>La Luna</h1><div class="card row">${moonSvg(K._e,44)}<div><h3>${PH[pi]}</h3><p class="mu" style="margin:0">${Math.round(K._ill*100)}% · ${K._age.toFixed(1)} giorni · in ${Z[ms]}</p></div></div>`+LP.map((p,i)=>`<div class="card" ${i==pi?'style="border-color:var(--gold)"':""}><h3>${PH[i]}</h3><p><b>Simbolo:</b> ${p.k}.<br><b>Favorire:</b> ${p.f}.<br><b>Lasciare andare:</b> ${p.r}.</p><p>${p.p}</p><p class="q">${p.q}</p></div>`).join("")+stamp()}
if(tab=="cielo"){const A=aspects(K,K,5,true).slice(0,8);h=`<h1>Il cielo adesso</h1><div class="card"><table>${Object.keys(GL).map(k=>`<tr><td>${GL[k]} ${k}</td><td>${pos(K[k])}${K._r[k]?" ℞":""}</td></tr>`).join("")}</table><p class="mu">℞ = moto retrogrado apparente. Sistema: zodiaco tropicale.</p></div><div class="card"><h3>Aspetti del momento</h3><table>${A.map(x=>`<tr><td>${GL[x.a]} ${x.a} ${x.n} ${GL[x.b]} ${x.b}</td><td>${x.o.toFixed(1)}°</td></tr>`).join("")||"<tr><td>Nessun aspetto stretto</td></tr>"}</table><p class="mu">Interpretazione simbolica: ogni aspetto invita a riflettere su come due aree della vita dialogano. Non è una previsione.</p></div><div class="src">Fonte: elementi orbitali di bassa precisione (Schlyter/Meeus), calcolati sul dispositivo. Plutone è approssimato (±1°). Orari di levata e tramonto lunare non ancora inclusi.</div>${stamp()}`}
if(tab=="diario"){const L=store.get("anima.diary",[]);h=`<h1>Diario</h1><div class="card"><textarea id="dn" rows="4" placeholder="Pensieri, sogni, intenzioni…"></textarea><button class="b" onclick="const v=$('#dn').value.trim();if(v){addEntry(v);draw()}">Salva</button><p class="mu">Resta sul tuo dispositivo, in questo browser.</p></div>`+(L.length?L.map(e=>`<div class="card"><p class="mu">${dt(e.id)} · ${e.sb} · ${e.ph} in ${e.sg}</p><p>${e.tx.replace(/</g,"&lt;")}</p><button class="g" onclick="delE(${e.id})">Elimina</button></div>`).join(""):`<p class="mu">Ancora nessuna nota. Scrivi la prima.</p>`)}
if(tab=="io"){h=`<h1>Io</h1><div class="card"><label>Nome (facoltativo)</label><input id="p1" value="${P.name||""}"><label>Data di nascita</label><input id="p2" type="date" value="${P.date||""}"><label>Ora di nascita (facoltativa)</label><input id="p3" type="time" value="${P.time||""}"><label>Latitudine e longitudine del luogo (es. 41.9, 12.5)</label><div class="row"><input id="p4" placeholder="lat" value="${P.lat||""}"><input id="p5" placeholder="lon" value="${P.lon||""}"></div><label>Fuso orario alla nascita (ore da UTC, es. 1 o 2 con ora legale)</label><input id="p6" value="${P.tz??""}"><button class="b" onclick="saveProf()">Salva</button></div>`;
if(N){h+=`<div class="card"><h3>Tema natale</h3><p class="mu">Zodiaco tropicale, case segno intero.</p><table><tr><td>Sole</td><td>${pos(N.l.Sole)}</td></tr><tr><td>Luna</td><td>${pos(N.l.Luna)}</td></tr>${P.time&&N.hasLoc?`<tr><td>Ascendente</td><td>${pos(N.asc)}</td></tr>`:""}</table>${P.time&&N.hasLoc?`<p class="mu">Case: ${Object.keys(GL).map(k=>`${GL[k]}${Math.floor(n360(N.l[k]-Math.floor(N.asc/30)*30)/30)+1}`).join(" ")}</p>`:`<p class="mu">Ora e coordinate servono per Ascendente e case.</p>`}</div>`}
h+=`<div class="card"><h3>Calendario</h3><p class="mu">Scarica un file con i Sabbat e le fasi lunari dei prossimi 12 mesi. Aprendolo su iPhone, scegli “Aggiungi tutto” e poi il calendario “ANIMA — Ruota dell’Anno”.</p><button class="b" onclick="exportICS()">Scarica calendario (.ics)</button></div><div class="card"><h3>Promemoria</h3><p class="mu">Ti avviso con delicatezza quando apri l’app e un Sabbat o una Luna nuova/piena è vicino. Non invio notifiche ad app chiusa.</p><button class="b" onclick="askNotif()">Attiva promemoria</button></div>`}
$("#app").innerHTML=h}
function saveProf(){store.set("anima.profile",{name:$("#p1").value,date:$("#p2").value,time:$("#p3").value,lat:$("#p4").value,lon:$("#p5").value,tz:$("#p6").value});draw()}
function delE(id){store.set("anima.diary",store.get("anima.diary",[]).filter(e=>e.id!=id));draw()}

function pad(n){return String(n).padStart(2,"0")}
const icsU=t=>{const d=new Date(t);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z"};
function exportICS(){const t0=Date.now(),ev=[];const sb=sabNow(new Date(t0)).list.filter(x=>x.t>=t0-864e5&&x.t<t0+366*864e5);
sb.forEach(x=>{const d=new Date(x.t),ds=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);ev.push(["sab-"+x.n+ds,"DTSTART;VALUE=DATE:"+ds+"\r\nDTEND;VALUE=DATE:"+e.getFullYear()+pad(e.getMonth()+1)+pad(e.getDate()),"ANIMA · "+x.n,SB[x.n].t])});
let t=t0;for(let i=0;i<14;i++){const p=nextPhases(t);p.forEach(x=>{if(x.t&&x.t<t0+366*864e5)ev.push(["moon"+x.n+icsU(x.t),"DTSTART:"+icsU(x.t)+"\r\nDTEND:"+icsU(x.t+36e5),"ANIMA · "+x.n,"Fase lunare calcolata da ANIMA"])});t=Math.max(...p.map(x=>x.t||0))+36e5}
const stamp=icsU(t0),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ANIMA//IT","CALSCALE:GREGORIAN","X-WR-CALNAME:ANIMA — Ruota dell’Anno"];
ev.forEach(e=>L.push("BEGIN:VEVENT","UID:"+e[0]+"@anima","DTSTAMP:"+stamp,e[1],"SUMMARY:"+e[2],"DESCRIPTION:"+e[3],"END:VEVENT"));L.push("END:VCALENDAR");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));a.download="anima-ruota-dellanno.ics";document.body.appendChild(a);a.click();a.remove()}
async function notify(m){try{const r=await navigator.serviceWorker.ready;r.showNotification("ANIMA",{body:m,icon:"icon-192.png",tag:m})}catch(e){}}
async function askNotif(){if(!("Notification" in window))return alert("Questo browser non supporta le notifiche.");const r=await Notification.requestPermission();store.set("anima.notif",r=="granted");alert(r=="granted"?"Promemoria attivi quando apri l’app.":"Permesso non concesso. Puoi cambiarlo nelle impostazioni del dispositivo.")}
function gentle(){if(!store.get("anima.notif",false)||Notification.permission!="granted")return;const n=new Date(),b=sabNow(n),dd=Math.ceil((b.next.t-+n)/864e5),k=store.get("anima.last","");const key=b.next.n+n.toDateString();if(k==key)return;
if(dd<=7){notify(`Sta arrivando ${b.next.n}. ${SB[b.next.n].t.split(",")[0]}: un momento per fermarti e ascoltare.`);store.set("anima.last",key)}else{const e=sky(+n)._e;if(e<12||e>348||Math.abs(e-180)<12){notify(Math.abs(e-180)<12?"Luna piena: tempo di gratitudine.":"Luna nuova: tempo di intenzioni.");store.set("anima.last",key)}}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(()=>gentle()).catch(()=>{});
draw();setInterval(()=>{if(["oggi","luna","cielo"].includes(tab)&&!document.activeElement.matches("textarea,input"))draw()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!document.activeElement.matches("textarea,input"))draw()});
</script></body></html>
